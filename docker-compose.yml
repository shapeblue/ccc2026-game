services:
  card-clash:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Set your own PIN; otherwise a random one is printed in the logs.
      ADMIN_PIN: "${ADMIN_PIN:-}"
      # The address players type on their phones, e.g. http://192.168.1.20:8080
      PUBLIC_URL: "${PUBLIC_URL:-}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
